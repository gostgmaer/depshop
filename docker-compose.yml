# DealMind AI — local development stack.
# Full guide: docs/INFRASTRUCTURE.md
#
#   Core infra (Postgres + Redis):       docker compose up -d
#   + admin UIs (pgAdmin, RedisInsight): docker compose --profile tools up -d
#   + containerised apps behind Traefik: docker compose --profile app up -d --build
#
# Every published port binds to 127.0.0.1 only, so nothing is reachable from
# other machines. Containers reach each other by service name on the
# `dealmind` network (postgres:5432, redis:6379).
#
# Single-platform, multi-user: one database, one Redis, no tenant-specific
# services or configuration.

name: dealmind

x-restart: &restart
  restart: unless-stopped

# Connection settings shared by every app container (api, migrate, and the
# BullMQ worker once apps/worker exists). Uses Docker service names.
x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-dealmind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dealmind}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

services:
  # ───────────────────────────── Core infrastructure ─────────────────────────────

  postgres:
    <<: *restart
    # PostgreSQL 17 with the pgvector extension preinstalled.
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dealmind}
      POSTGRES_USER: ${POSTGRES_USER:-dealmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [dealmind]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    <<: *restart
    image: redis:7.4.2-alpine
    # Password + command restrictions as an ACL include written at start
    # (see infrastructure/docker/redis/redis.conf): never on redis-server's argv.
    entrypoint:
      - sh
      - -c
      - umask 077 && printf 'user default on >%s ~* &* +@all -flushall -flushdb -config -module -debug\n' "$$REDIS_PASSWORD" > /tmp/acl.conf
        && exec redis-server /usr/local/etc/redis/redis.conf --include /tmp/acl.conf
    environment:
      # Also read by the health check via REDISCLI_AUTH.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./infrastructure/docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [dealmind]
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Identity, email and file storage come from the shared EasyDev services
  # (IAM, notification-service, file-upload-service) running in their own
  # stacks on the external `core-network`. DealMind runs no copies of them.

  # ───────────────────────────── Dev-only admin UIs ─────────────────────────────
  # Opt-in via `--profile tools`. Never enable this profile in production.

  pgadmin:
    <<: *restart
    profiles: [tools]
    image: dpage/pgadmin4:9.0
    entrypoint: ["/bin/sh", "/opt/dealmind/entrypoint.sh"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_DISABLE_POSTFIX: "true"
      # Consumed by the wrapper entrypoint to pre-register the server.
      POSTGRES_DB: ${POSTGRES_DB:-dealmind}
      POSTGRES_USER: ${POSTGRES_USER:-dealmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./infrastructure/docker/pgadmin/entrypoint.sh:/opt/dealmind/entrypoint.sh:ro
    networks: [dealmind]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/misc/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redisinsight:
    <<: *restart
    profiles: [tools]
    image: redis/redisinsight:2.70.1
    environment:
      # Pre-registers the DealMind Redis connection. RedisInsight only applies
      # this AFTER its EULA is accepted: either click through the prompt in the
      # UI once (then restart this service), or opt in via .env.
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
      RI_REDIS_ALIAS: DealMind (local)
      RI_REDIS_PASSWORD: ${REDIS_PASSWORD}
      RI_ACCEPT_TERMS_AND_CONDITIONS: ${REDISINSIGHT_ACCEPT_EULA:-false}
    ports:
      - "127.0.0.1:${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight-data:/data
    networks: [dealmind]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5540/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ───────────────────────────── Containerised apps ─────────────────────────────
  # Opt-in via `--profile app`. For day-to-day development, run the apps on the
  # host with `pnpm dev` against the core infrastructure instead.

  traefik:
    <<: *restart
    profiles: [app]
    image: traefik:v3.6.25
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=dealmind
      - --entrypoints.web.address=:80
      - --ping=true
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [dealmind]

  migrate:
    profiles: [app]
    build: { context: ., dockerfile: apps/api/Dockerfile, target: build }
    working_dir: /repo/packages/db
    command: ["sh", "-c", "pnpm migrate:deploy && pnpm seed"]
    environment:
      <<: *app-env
    networks: [dealmind]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *restart
    profiles: [app]
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      <<: *app-env
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      APP_URL: http://localhost
      TRUST_PROXY: uniquelocal
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Set TOKEN_ENCRYPTION_KEY in .env}
      # Shared EasyDev services, reached by container name on core-network.
      IAM_BASE_URL: http://auth-service:3000/api/v1/iam
      IAM_TENANT: ${IAM_TENANT:-easydev}
      IAM_JWT_ISSUER: ${IAM_JWT_ISSUER:-iam-service}
      IAM_JWT_AUDIENCE: ${IAM_JWT_AUDIENCE:-easydev}
      NOTIFICATION_SERVICE_URL: http://notification-service:4000
      NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY:-}
      NOTIFICATION_TENANT_ID: ${NOTIFICATION_TENANT_ID:-dealmind}
      NOTIFICATION_TOKEN_SECRET: ${NOTIFICATION_TOKEN_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-none}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://payment-service:3200/api/v1}
      PAYMENT_SERVICE_API_KEY: ${PAYMENT_SERVICE_API_KEY:-}
      PAYMENT_TENANT_ID: ${PAYMENT_TENANT_ID:-easydev}
      PAYMENT_APPLICATION_ID: ${PAYMENT_APPLICATION_ID:-dealmind}
      BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-3}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      FILE_SERVICE_URL: http://file-upload-service:3000
      FILE_SERVICE_HMAC_SECRET: ${FILE_SERVICE_HMAC_SECRET:-}
      FILE_SERVICE_TENANT_ID: ${FILE_SERVICE_TENANT_ID:-dealmind}
      # Internal service API for the Python agent (/internal/v1, never routed by Traefik).
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
      AGENT_USER_CONTEXT_SECRET: ${AGENT_USER_CONTEXT_SECRET:?Set AGENT_USER_CONTEXT_SECRET in .env}
      AGENT_SERVICE_URL: http://agent:8100
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?Set AGENT_SERVICE_TOKEN in .env}
      CONNECTORS_ENABLE_MOCKS: "false"
      FLIPKART_AFFILIATE_ID: ${FLIPKART_AFFILIATE_ID:-}
      FLIPKART_AFFILIATE_TOKEN: ${FLIPKART_AFFILIATE_TOKEN:-}
      AMAZON_CREATORS_CREDENTIAL_ID: ${AMAZON_CREATORS_CREDENTIAL_ID:-}
      AMAZON_CREATORS_CREDENTIAL_SECRET: ${AMAZON_CREATORS_CREDENTIAL_SECRET:-}
      AMAZON_ASSOCIATES_PARTNER_TAG: ${AMAZON_ASSOCIATES_PARTNER_TAG:-}
    networks: [dealmind, core-network]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    labels:
      # Same origin as the web app: /api/* goes to the API, so session
      # cookies stay first-party.
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`localhost`) && PathPrefix(`/api`)
      - traefik.http.routers.api.priority=100
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=4000

  web:
    <<: *restart
    profiles: [app]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      # Server-side calls (session checks in layouts) go straight to the API.
      API_INTERNAL_URL: http://api:4000
      # Traefik sits in front and overwrites client-supplied X-Forwarded-For.
      TRUSTED_PROXY_COUNT: "1"
      # Privacy notice operator/contact (required before launch).
      PRIVACY_OPERATOR_NAME: ${PRIVACY_OPERATOR_NAME:-}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
    networks: [dealmind]
    depends_on:
      api: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.http.routers.web.rule=Host(`localhost`)
      - traefik.http.routers.web.entrypoints=web
      - traefik.http.services.web.loadbalancer.server.port=3000

  # BullMQ worker: supervises the Python agent, runs connector health checks and
  # global price tracking (scheduler, refresh, alert evaluation, notifications).
  worker:
    <<: *restart
    profiles: [app]
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    environment:
      <<: *app-env
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AGENT_SERVICE_URL: http://agent:8100
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?Set AGENT_SERVICE_TOKEN in .env}
      AGENT_USER_CONTEXT_SECRET: ${AGENT_USER_CONTEXT_SECRET:?Set AGENT_USER_CONTEXT_SECRET in .env}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-180}
      CONNECTORS_ENABLE_MOCKS: "false"
      FLIPKART_AFFILIATE_ID: ${FLIPKART_AFFILIATE_ID:-}
      FLIPKART_AFFILIATE_TOKEN: ${FLIPKART_AFFILIATE_TOKEN:-}
      AMAZON_CREATORS_CREDENTIAL_ID: ${AMAZON_CREATORS_CREDENTIAL_ID:-}
      AMAZON_CREATORS_CREDENTIAL_SECRET: ${AMAZON_CREATORS_CREDENTIAL_SECRET:-}
      AMAZON_ASSOCIATES_PARTNER_TAG: ${AMAZON_ASSOCIATES_PARTNER_TAG:-}
      TRACKING_ENABLED: ${TRACKING_ENABLED:-true}
      TRACKING_SOURCE_SHARE: ${TRACKING_SOURCE_SHARE:-0.5}
      TRACKING_MAX_QUEUED: ${TRACKING_MAX_QUEUED:-2000}
      PRICE_TRACKING_CONCURRENCY: ${PRICE_TRACKING_CONCURRENCY:-8}
      # Shared EasyDev notification service, reached by container name on core-network.
      NOTIFICATION_SERVICE_URL: http://notification-service:4000
      NOTIFICATION_API_KEY: ${NOTIFICATION_API_KEY:-}
      NOTIFICATION_TENANT_ID: ${NOTIFICATION_TENANT_ID:-dealmind}
      NOTIFICATION_TOKEN_SECRET: ${NOTIFICATION_TOKEN_SECRET:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-none}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-http://payment-service:3200/api/v1}
      PAYMENT_SERVICE_API_KEY: ${PAYMENT_SERVICE_API_KEY:-}
      PAYMENT_TENANT_ID: ${PAYMENT_TENANT_ID:-easydev}
      PAYMENT_APPLICATION_ID: ${PAYMENT_APPLICATION_ID:-dealmind}
      BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-3}
      APP_URL: ${APP_URL:-http://localhost}
    networks: [dealmind, core-network]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      agent: { condition: service_healthy }

  # Python LangGraph agent. Internal only: no published port, no Traefik labels.
  agent:
    <<: *restart
    profiles: [app]
    build: { context: ., dockerfile: apps/agent/Dockerfile }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-dealmind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-dealmind}
      CHECKPOINTER: postgres
      INTERNAL_API_URL: http://api:4000/internal/v1
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in .env}
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?Set AGENT_SERVICE_TOKEN in .env}
      AGENT_USER_CONTEXT_SECRET: ${AGENT_USER_CONTEXT_SECRET:?Set AGENT_USER_CONTEXT_SECRET in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-google}
      LLM_MODEL: ${LLM_MODEL:?Set LLM_MODEL in .env}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.2}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-8192}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [dealmind]
    depends_on:
      migrate: { condition: service_completed_successfully }

networks:
  dealmind:
    name: dealmind
    driver: bridge
  # Created by the shared EasyDev stacks (IAM, notifications, file uploads).
  # Only the containerised API (app profile) joins it.
  core-network:
    external: true

volumes:
  postgres-data:
  redis-data:
  pgadmin-data:
  redisinsight-data:
