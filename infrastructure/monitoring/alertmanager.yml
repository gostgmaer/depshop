# DealMind AI — Alertmanager. One webhook receiver (chat, pager or incident tool
# that accepts the Alertmanager webhook format); the URL is read from a file
# written at start from ALERTMANAGER_WEBHOOK_URL, never committed.
route:
  receiver: ops
  group_by: [alertname, queue, source]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: ops
      repeat_interval: 1h

receivers:
  - name: ops
    webhook_configs:
      - url_file: /tmp/webhook_url
        send_resolved: true

inhibit_rules:
  # When the site is down, don't page for every symptom behind it.
  - source_matchers: [alertname="SiteDown"]
    target_matchers: [severity="warning"]
