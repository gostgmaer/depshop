# DealMind AI — Prometheus alert rules. Catalogue and runbook links:
# docs/monitoring-and-alerting.md. Thresholds are starting points; tune them
# to observed traffic after launch.
groups:
  - name: availability
    rules:
      - alert: SiteDown
        expr: probe_success{job="public"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "Public endpoint {{ $labels.instance }} failing"
          runbook: docs/incident-response.md#site-down
      - alert: ApiNotReady
        expr: probe_success{job="internal-ready", instance=~".*api.*"} == 0
        for: 3m
        labels: { severity: critical }
        annotations:
          summary: "API /ready failing: database, Redis or IAM unavailable"
          runbook: docs/incident-response.md#dependency-down
      - alert: AgentNotReady
        expr: probe_success{job="internal-ready", instance=~".*agent.*"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Agent /ready failing: searches cannot run"
          runbook: docs/incident-response.md#agent-failures
      - alert: MetricsScrapeFailing
        expr: up{job="api"} == 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Prometheus cannot scrape the API (down, or METRICS_TOKEN mismatch)"
      - alert: CertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry{job="public"} - time()) / 86400 < 14
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "TLS certificate for {{ $labels.instance }} expires in < 14 days (renewal failing?)"
          runbook: docs/incident-response.md#certificate-renewal

  - name: api
    rules:
      - alert: ApiHighErrorRate
        expr: |
          sum(rate(dealmind_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(dealmind_http_requests_total[5m])), 1) > 0.02
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "More than 2% of API requests are failing with 5xx"
          runbook: docs/incident-response.md#api-errors
      - alert: ApiHighLatency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(dealmind_http_request_duration_seconds_bucket{route!~".*/(stream|events)"}[5m]))) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "API p95 latency above 1 s (SSE streams excluded)"

  - name: pipeline
    rules:
      - alert: QueueBacklog
        expr: sum by (queue) (dealmind_queue_jobs{state=~"waiting|prioritized"}) > 500
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Queue {{ $labels.queue }} has a sustained backlog"
          runbook: docs/incident-response.md#queue-backlog
      - alert: QueueWithoutWorkers
        # billing-control only has a worker when BILLING_PROVIDER=easydev-payments.
        expr: dealmind_queue_workers{queue!~"dead-letter|billing-control"} == 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "No worker is consuming queue {{ $labels.queue }}"
          runbook: docs/incident-response.md#worker-failures
      - alert: JobsFailing
        expr: increase(dealmind_queue_jobs{state="failed"}[30m]) > 20
        labels: { severity: warning }
        annotations:
          summary: "Failed jobs increasing on {{ $labels.queue }}"
      - alert: DeadLetters
        expr: sum(dealmind_queue_jobs{queue="dead-letter", state=~"waiting|prioritized"}) > 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Jobs exhausted their retries (see Admin → Jobs)"
      - alert: SearchFailureRate
        expr: |
          sum(dealmind_searches_15m{status="FAILED"})
            / clamp_min(sum(dealmind_searches_15m{status=~"COMPLETED|PARTIAL|FAILED"}), 1) > 0.2
          and sum(dealmind_searches_15m) > 10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "More than 20% of searches are failing"
      - alert: AgentRunsFailing
        expr: |
          sum(dealmind_agent_runs_15m{status="FAILED"}) / clamp_min(sum(dealmind_agent_runs_15m), 1) > 0.2
          and sum(dealmind_agent_runs_15m) > 10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "More than 20% of agent runs are failing"
          runbook: docs/incident-response.md#agent-failures
      - alert: AgentSlow
        expr: dealmind_agent_run_duration_ms_15m{stat="avg"} > 60000
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Average agent run takes over 60 s"
      - alert: PriceChecksFailing
        expr: |
          sum(dealmind_price_checks_15m{outcome=~"FAILED|INVALID"})
            / clamp_min(sum(dealmind_price_checks_15m{outcome!="SKIPPED"}), 1) > 0.3
          and sum(dealmind_price_checks_15m) > 20
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "More than 30% of price checks are not succeeding"
      - alert: NotificationDeliveryFailures
        expr: sum(dealmind_notification_deliveries_15m{status="FAILED"}) > 10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Email/push deliveries are failing"
      - alert: PaymentWebhookFailures
        expr: sum(dealmind_payment_webhooks_15m{processing_status="FAILED"}) > 0
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Payment-service webhooks failed processing (subscriptions may be stale)"
          runbook: docs/incident-response.md#payments
      - alert: ConnectorDown
        expr: dealmind_source_up{status="ACTIVE"} == 0
        for: 30m
        labels: { severity: warning }
        annotations:
          summary: "Active source {{ $labels.source }} is {{ $labels.health }}"

  - name: host
    rules:
      - alert: DiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
            / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"} < 0.15
        for: 15m
        labels: { severity: critical }
        annotations:
          summary: "Less than 15% disk space left"
      - alert: MemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Less than 10% memory available"

  - name: backups
    rules:
      - alert: BackupMissing
        expr: time() - dealmind_backup_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "No successful database backup in the last 26 hours"
          runbook: docs/backup-and-recovery.md
      - alert: BackupMetricAbsent
        expr: absent(dealmind_backup_last_success_timestamp_seconds)
        for: 30h
        labels: { severity: critical }
        annotations:
          summary: "No backup has ever reported success on this host"
      - alert: RestoreTestStale
        expr: time() - dealmind_restore_test_last_success_timestamp_seconds > 8 * 86400
        for: 1h
        labels: { severity: warning }
        annotations:
          summary: "No successful restore test in 8 days"
