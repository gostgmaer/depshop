# DealMind Redis configuration (development).
# The password is supplied at runtime via `--requirepass` from REDIS_PASSWORD;
# it is never stored in this file.

bind 0.0.0.0
protected-mode yes
port 6379

# Persistence: AOF for durability of BullMQ job state, plus periodic RDB snapshots.
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000
dir /data

# BullMQ REQUIRES noeviction: evicting keys silently corrupts queues.
# Caches must therefore set explicit TTLs rather than rely on eviction.
maxmemory 512mb
maxmemory-policy noeviction

# Authentication and dangerous-command restrictions are an ACL generated at
# container start (docker-compose files): `user default on >PASSWORD ~* &* +@all
# -flushall -flushdb -config -module -debug`, in a private include file, so the
# password is neither in this file nor on the command line.
# Why an ACL and not rename-command: a renamed command also breaks replay of an
# AOF that ever recorded it (the server then refuses to start); ACLs apply only
# to clients. FLUSHALL/FLUSHDB are whole-database wipes (BullMQ, the API and the
# tests delete by key prefix); CONFIG/MODULE/DEBUG allow runtime reconfiguration
# and module loading (classic paths from Redis access to code execution).
