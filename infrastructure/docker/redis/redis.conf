# DealMind Redis configuration (development).
# The password is supplied at runtime via `--requirepass` from REDIS_PASSWORD;
# it is never stored in this file.

bind 0.0.0.0
protected-mode yes
port 6379

# Persistence: AOF for durability of BullMQ job state, plus periodic RDB snapshots.
appendonly yes
appendfsync everysec
save 900 1
save 300 10
save 60 10000
dir /data

# BullMQ REQUIRES noeviction: evicting keys silently corrupts queues.
# Caches must therefore set explicit TTLs rather than rely on eviction.
maxmemory 512mb
maxmemory-policy noeviction

# Disable dangerous commands for non-admin use.
rename-command DEBUG ""
