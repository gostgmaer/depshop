[project]
name = "dealmind-agent"
version = "0.1.0"
description = "DealMind AI shopping intelligence agent (LangGraph, FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "langgraph>=0.6",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langchain-google-genai>=2.0",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "sqlalchemy[asyncio]>=2.0",
  "structlog>=24.4",
  "opentelemetry-api>=1.27",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "mypy>=1.13",
  "ruff>=0.7",
]

[tool.uv]
# Supply-chain hygiene: only releases at least two weeks old (2026-11-15).
exclude-newer = "2026-11-01T00:00:00Z"
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PT018"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["langchain_google_genai.*", "respx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests pass partial graph states/dicts on purpose; the app itself is fully strict.
module = ["tests.*"]
disable_error_code = ["typeddict-item", "arg-type", "unused-ignore", "union-attr", "index"]
